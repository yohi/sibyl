name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: >-
          node --input-type=module -e
          'import("./dist/index.js").then(async ({ PtyManager }) => { const manager = new PtyManager(); const terminal = await manager.spawn({ command: "sh", args: ["-c", "exit 0"] }); await manager.terminate(terminal.id); })'

  container-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace"
          -w /workspace
          oven/bun:1.3.14
          sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 make g++ procps && bun install --frozen-lockfile && bun run lint && bun run typecheck && bun run build && bun run test'
